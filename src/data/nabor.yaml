heading: Nábor ročník 2021
text: Hledáme drobná, štíhlá a šikovná děvčátka, která mají zájem rozvíjet své pohybové schopnosti, trénovat na nářadí a připravovat se na závody. Přijďte s rodiči na trénink.
when: út a pá, 15:30–16:30
where: Tyršův dům, 1. patro, vchod vpravo od hlavního vchodu sportovní haly
